plugins { id 'com.android.application' }
android {
  namespace 'com.phillip.volumemax'
  compileSdk 35
  defaultConfig { applicationId 'com.phillip.volumemax'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.1' }
  signingConfigs { release { storeFile file('../release.jks'); storePassword System.getenv('KS_PASS'); keyAlias 'volumemax'; keyPassword System.getenv('KS_PASS') } }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
